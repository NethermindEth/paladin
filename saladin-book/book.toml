[book]
title = "Saladin — Programmable Privacy for Stellar Soroban"
description = "Technical implementation plan: Paladin today and the Stellar/Soroban port (Saladin)."
authors = ["LFDT-Paladin / Saladin book contributors"]
src = "."
language = "en"

[build]
build-dir = "book-dist"
create-missing = false

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/LFDT-Paladin/paladin"
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.fold]
enable = true
level = 1
