nodeName: node3
db:
  type: sqlite
  sqlite:
    dsn: ":memory:"
    autoMigrate: true
    migrationsDir: "../../db/migrations/sqlite"
    debugQueries: false
grpc:
  shutdownTimeout: 0s
rpcServer:
  http:
    port: 0
    shutdownTimeout: 0s
  ws:
    disabled: true
    shutdownTimeout: 0s
baseLedger:
  type: stellar
  stellar:
    url: http://localhost:8000/soroban/rpc
    # "Standalone Network ; February 2017" is the well-known passphrase for a stellar/quickstart
    # `--local` network (testinfra/docker-compose-test.yml's stellar_quickstart service) - confirm
    # against current Stellar Development Foundation docs if quickstart's local-network passphrase
    # ever changes.
    networkPassphrase: "Standalone Network ; February 2017"
    ingestor:
      pollInterval: "1s" # quickstart --local closes ledgers roughly every 1s
      insertDBBatchSize: 100
    channelAccounts:
      poolSize: 8
      funder: root
      startingBalance: "5"
wallets:
  # bip44HardenedSegments: 5 on both wallets below - SLIP-10 ed25519 derivation (used for every
  # Stellar/ed25519 identity resolved here) requires *all* path segments to be hardened, unlike
  # secp256k1/EVM's default of 1 (pldconf.SignerConfigDefaults.KeyDerivation.BIP44HardenedSegments)
  # - a plain (unhardened) segment fails with "PD020829: SLIP-10 ed25519 derivation requires all
  # path segments to be hardened". 5 covers any path depth Paladin's identity resolution builds.
  # "root" derives the raw secret seed of the standalone network's master/root account
  # (seed = SHA-256(networkPassphrase) - see network.ID in github.com/stellar/go-stellar-sdk),
  # which already holds the entire genesis supply on a freshly started quickstart network. There
  # is no friendbot here (Horizon is never started - see the stellar_quickstart service comment),
  # so this is how channel accounts get funded in this dev/test setup. keySelector is listed before
  # wallet1's catch-all below because wallet selection is first-match-wins in config order.
  - name: root
    keySelector: "^root$"
    signer:
      keyDerivation:
        type: "bip32"
        bip44HardenedSegments: 5
      keyStore:
        type: "static"
        static:
          keys:
            seed:
              encoding: hex
              inline: baefd734b8d3e48472cff83912375fedbc7573701912fe308af730180f97d74a
  - name: wallet1
    keySelector: .*
    signer:
      keyDerivation:
        type: "bip32"
        bip44HardenedSegments: 5
      keyStore:
        type: "static"
        static:
          keys:
            seed:
              encoding: hex
              inline: 5bb9f8aeefc59b53295caec27955040a4f8f902c7c963560206d2d3d18cb2693
sequencerManager:
  heartbeatInterval: "1s"
  inactiveGracePeriod: 2
