[package]
name = "sente-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sente Phase 1 spike: embeds soroban-env-host/soroban-simulation directly, proves recording-mode invocation and cross-process deterministic re-execution before any real domain-plugin logic is built."

[dependencies]
soroban-env-host = { version = "=27.0.0", features = ["testutils"] }
soroban-simulation = { version = "=27.0.0", features = ["testutils"] }
anyhow = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
assert_cmd = "2"
