[package]
name = "sente-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Embeds soroban-env-host/soroban-simulation directly: deterministic recording-mode invocation, digesting, and the SenteEntry state model, reused by both the Phase 1 CLI spike and the real domain plugin (crates/sente)."

[dependencies]
soroban-env-host = { version = "=27.0.0", features = ["testutils"] }
soroban-simulation = { version = "=27.0.0", features = ["testutils"] }
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[dev-dependencies]
assert_cmd = "2"
