services:
  postgres:
    image: postgres:17.6
    command: -c 'max_connections=200'
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: my-secret

  # Free gas Besu setup
  besu_bootstrap_free:
    image: paladin/besu_bootstrap
    user: 0:0
    volumes:
      - besu_free_data:/var/besu:rw
    command:
      - --min-gas-price=0
      - --zero-base-fee=true
      - /var/besu

  besu_free:
    image: hyperledger/besu:25.8.0
    user: 0:0
    volumes:
      - besu_free_data:/var/besu:rw
    ports:
      - 8545:8545  # HTTP RPC
      - 8546:8546  # WebSocket RPC
    depends_on:
      besu_bootstrap_free:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "timeout 10s bash -c ':> /dev/tcp/localhost/8545'"]
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      - --logging=DEBUG
      - --rpc-http-enabled
      - --rpc-http-api=ETH,QBFT,WEB3,DEBUG
      - --rpc-ws-enabled
      - --rpc-ws-api=ETH,QBFT,WEB3,DEBUG
      - --tx-pool=SEQUENCED
      - --tx-pool-limit-by-account-percentage=1.0
      - --tx-pool-max-size=1000000
      - --target-gas-limit=30000000
      - --genesis-file=/var/besu/genesis.json
      - --data-path=/var/besu/data
      - --node-private-key-file=/var/besu/key
      - --revert-reason-enabled
      - --host-allowlist=localhost,besu_free,127.0.0.1
      - --rpc-http-host=0.0.0.0
      - --rpc-ws-host=0.0.0.0
      - --min-gas-price=0

  # Gas-priced Besu setup
  besu_bootstrap_gas:
    image: paladin/besu_bootstrap
    user: 0:0
    volumes:
      - besu_gas_data:/var/besu:rw
    command:
      - --min-gas-price=1000000000
      - --zero-base-fee=false
      - --seeds=b461057bef2aeaf43816f95b3c41b667d6fa56342f278d9237d7463226fd101d,a461057bef2aeaf43816f95b3c41b667d6fa56342f278d9237d7463226fd101e,c461057bef2aeaf43816f95b3c41b667d6fa56342f278d9237d7463226fd101f
      - --prefunded-derivation-paths=m/44'/60'/1',m/44'/60'/1'/0/0,m/44'/60'/1'/0/1,m/44'/60'/2',m/44'/60'/2'/0/0,m/44'/60'/2'/0/0/0,m/44'/60'/3',m/44'/60'/3'/0/0,m/44'/60'/4',m/44'/60'/4'/0/0
      - /var/besu

  besu_gas:
    image: hyperledger/besu:25.8.0
    user: 0:0
    volumes:
      - besu_gas_data:/var/besu:rw
    ports:
      - 8555:8545  # HTTP RPC (different port)
      - 8556:8546  # WebSocket RPC (different port)
    depends_on:
      besu_bootstrap_gas:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "timeout 10s bash -c ':> /dev/tcp/localhost/8545'"]
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      - --logging=DEBUG
      - --rpc-http-enabled
      - --rpc-http-api=ETH,QBFT,WEB3,DEBUG
      - --rpc-ws-enabled
      - --rpc-ws-api=ETH,QBFT,WEB3,DEBUG
      - --tx-pool=SEQUENCED
      - --tx-pool-limit-by-account-percentage=1.0
      - --tx-pool-max-size=1000000
      - --target-gas-limit=30000000
      - --genesis-file=/var/besu/genesis.json
      - --data-path=/var/besu/data
      - --node-private-key-file=/var/besu/key
      - --revert-reason-enabled
      - --host-allowlist=localhost,besu_gas,127.0.0.1
      - --rpc-http-host=0.0.0.0
      - --rpc-ws-host=0.0.0.0
      - --min-gas-price=1000000000

  # Stellar quickstart standalone network (chapter 12 §12.6/§12.7) - core + stellar-rpc only.
  # Started with `--enable rpc` (not `horizon`): in `--local` mode core always runs regardless of
  # `--enable`, but horizon/friendbot only run if `horizon` is requested - so leaving it off here
  # means Horizon never starts in this container at all. This codebase has deliberately migrated
  # off Horizon entirely (see saladin-book ch.12 §12.1) and must not grow a dependency on it again;
  # Paladin's baseLedger.stellar.url talks to stellar-rpc directly.
  # `--local` runs a single-validator standalone network using the well-known
  # "Standalone Network ; February 2017" passphrase, with ledgers closing roughly every 1s.
  # NOTE: image/tag/flags reflect the stellar/quickstart docs (https://github.com/stellar/quickstart)
  # as of this writing - reconfirm against current SDF docs before relying on this beyond local dev.
  stellar_quickstart:
    image: stellar/quickstart:testing
    ports:
      - 8000:8000  # stellar-rpc (Soroban RPC), served at /soroban/rpc - no Horizon on this port
    environment:
      # The image's own default (baked into /image.json's protocol_version_default, observed: 25)
      # lags behind what its bundled stellar-core/soroban-rpc/soroban-sdk (all v27.0.0, matching
      # soroban/Cargo.toml's pinned soroban-sdk) actually support (up to protocol 27) - and
      # soroban-env-host's check_ledger_protocol_supported() requires an *exact* match to its own
      # INTERFACE_VERSION.protocol (soroban-env-common's meta.rs), not just "new enough". So a
      # contract built with this workspace's pinned soroban-sdk fails to deploy at all against a
      # default-genesis ledger, with an otherwise-unhelpful `HostError: Error(Context,
      # InternalError)`. PROTOCOL_VERSION is the image's own supported override (read by its
      # `/start` script, defaulting to PROTOCOL_VERSION_DEFAULT) - setting it directly here lets
      # the image bootstrap at the right protocol itself, rather than externally forcing a
      # protocol upgrade after the fact (tried first; races the image's own bootstrap-time
      # upgrade/soroban-config sequence and can crash the container).
      - PROTOCOL_VERSION=27
    command:
      - --local
      - --enable
      - rpc
    healthcheck:
      test: ["CMD-SHELL", "timeout 10s bash -c ':> /dev/tcp/localhost/8000'"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  besu_free_data:
    driver: local
  besu_gas_data:
    driver: local
