[workspace]
resolver = "3"
members = [
    "crates/saladin-typed-data",
    "crates/atom-operation",
    "contracts/factory",
    "contracts/snoto",
    "contracts/szeto",
    "contracts/satom",
    "contracts/satom-factory",
    "contracts/snoto-factory",
    "contracts/sente",
    "contracts/sente-factory",
    "contracts/identity-registry",
    "contracts/test-counter",
    "contracts/repo-terms",
    "contracts/repo-terms-factory",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.92.0"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
soroban-sdk = "27.0.0"
saladin-typed-data = { path = "crates/saladin-typed-data" }
atom-operation = { path = "crates/atom-operation" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
