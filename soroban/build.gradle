import java.security.MessageDigest

ext {
    buildOutput = layout.projectDirectory.dir('artifacts')
}

configurations {
    compiledWasm {
        canBeConsumed = true
        canBeResolved = false
    }
}

def sourceFiles = fileTree(".") {
    include "**/Cargo.toml"
    include "**/src/**/*.rs"
    exclude "target/**"
    exclude "artifacts/**"
}

// Runs before the wasm build (unlike solidity's compile-then-test order): `cargo test` builds
// for the native host target, so it doesn't need `stellar contract build`'s wasm/optimization
// pass to have already happened first.
task cargoTest(type: Exec) {
    executable 'cargo'
    args 'test', '--workspace', '--locked'

    inputs.files(sourceFiles)
    inputs.file("Cargo.lock")
}

// Runs once at the workspace root (not per-contract): `stellar contract build` discovers every
// cdylib crate in the workspace on its own.
task compile(type: Exec, dependsOn: cargoTest) {
    executable 'stellar'
    args 'contract', 'build'
    args '--locked'
    args '--out-dir', buildOutput.asFile.path

    inputs.files(sourceFiles)
    inputs.file("Cargo.lock")
    outputs.dir(buildOutput)

    doLast {
        def hashes = [:]
        buildOutput.asFile.listFiles({ f -> f.name.endsWith('.wasm') } as FileFilter)?.sort { it.name }?.each { wasmFile ->
            def digest = MessageDigest.getInstance("SHA-256").digest(wasmFile.bytes)
            hashes[wasmFile.name] = digest.collect { String.format('%02x', it) }.join('')
        }
        file("${buildOutput}/hashes.json").text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(hashes))
    }
}

task assemble {
    enabled = false
}

task build(dependsOn: compile) {}

task clean(type: Delete) {
    delete "target"
    delete buildOutput
}

artifacts {
    compiledWasm(buildOutput) {
        builtBy(compile)
    }
}
